<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download Invoices – AMG Associates</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 40px;height:70px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(30,58,95,.08)}
.logo-area{display:flex;align-items:center;gap:14px}
.logo-area img{height:46px;object-fit:contain}
.logo-text strong{font-size:1.05rem;font-weight:700;color:#1e3a5f;display:block}
.logo-text small{font-size:.68rem;color:#64748b;letter-spacing:.1em;text-transform:uppercase}
.new-order{font-size:.8rem;color:#1e3a5f;text-decoration:none;border:1.5px solid #e2e8f0;padding:7px 16px;border-radius:8px;font-weight:600;transition:all .2s}
.new-order:hover{border-color:#1e3a5f}
.container{max-width:680px;margin:0 auto;padding:48px 24px}
.success-top{text-align:center;margin-bottom:36px}
.check-circle{width:76px;height:76px;background:linear-gradient(135deg,#059669,#10b981);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(5,150,105,.3)}
.check-circle svg{width:36px;height:36px;stroke:#fff;stroke-width:2.5;fill:none}
.success-top h1{font-size:2rem;font-weight:700;margin-bottom:8px}
.success-top p{color:#64748b;font-size:.9rem;max-width:400px;margin:0 auto}
.meta-row{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:16px 22px;margin-bottom:22px;display:flex;gap:24px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.mi label{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:#94a3b8;font-weight:600;display:block;margin-bottom:2px}
.mi span{font-size:.88rem;font-weight:600;color:#1e293b}
.note{background:#fefce8;border:1.5px solid #fde047;border-radius:10px;padding:14px 18px;font-size:.82rem;color:#713f12;margin-bottom:22px;line-height:1.65}
.note strong{display:block;margin-bottom:3px}
.sec-label{font-size:.71rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#1e3a5f;margin-bottom:12px}
.dl-all-btn{width:100%;background:linear-gradient(135deg,#1e3a5f,#2563a8);color:#fff;border:none;border-radius:10px;padding:15px;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:14px;transition:all .2s}
.dl-all-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,58,95,.28)}
.dl-all-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.dl-list{display:flex;flex-direction:column;gap:8px}
.dl-row{background:#fff;border:1.5px solid #e2e8f0;border-radius:9px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .2s}
.dl-row:hover{border-color:#1e3a5f}
.dl-row .info .name{font-size:.87rem;font-weight:600;color:#1e293b}
.dl-row .info .type{font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.dl-btn{background:#1e3a5f;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:all .2s}
.dl-btn:hover{background:#2563a8}
.dl-btn:disabled{opacity:.55;cursor:not-allowed}
.dl-btn.done{background:#dcfce7;color:#166534;border:1px solid #86efac}
.expired{text-align:center;padding:52px 20px;background:#fff;border-radius:16px;margin-top:20px}
.expired .icon{font-size:3.5rem;margin-bottom:14px}
.expired h2{font-size:1.5rem;font-weight:700;margin-bottom:8px}
.expired p{color:#64748b;margin-bottom:22px;font-size:.9rem}
.expired a{background:#1e3a5f;color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;font-weight:600;font-size:.9rem;display:inline-block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(70px);background:#1e293b;color:#fff;padding:10px 22px;border-radius:8px;font-size:.86rem;z-index:9999;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.overlay.show{display:flex}
.spinner{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:#1e3a5f;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){header{padding:0 14px}.container{padding:32px 14px}.meta-row{flex-direction:column;gap:12px}}
</style>
</head>

  try{
    const r=await fetch('/api/store');
    const d=await r.json();
    render(token,d.invoices);
  }catch(e){showExpired('Could not connect to server.');}
}

const ICONS={'Simple Invoice':'🧾','Delivery Challan':'🚚','Quotation':'📋','Proforma Invoice':'📄','Bill to Ship to':'📦'};

function render(token,invoices){
  document.getElementById('mainContent').innerHTML=`
    <div class="success-top">
      <div class="check-circle"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h1>Payment Confirmed! 🎉</h1>
      <p>Your 13 customized GST invoice templates are ready. Each file contains your company details.</p>
    </div>
    <div class="meta-row">
      <div class="mi"><label>Status</label><span style="color:#059669">✅ Paid &amp; Ready</span></div>
      <div class="mi"><label>Templates</label><span>13 Formats</span></div>
      <div class="mi"><label>Link Valid</label><span>24 Hours</span></div>
    </div>
    <div class="note">
      <strong>💡 How to use your invoices</strong>
      Open the .xlsx files in Microsoft Excel, Google Sheets, or LibreOffice. Your company name, address, GSTIN, PAN and phone are already filled in. Add your customer details and invoice items to get started.
    </div>
    <div class="sec-label">Download Your Customized Invoices</div>
    <button class="dl-all-btn" id="dlAllBtn" onclick="dlAll('${token}')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download All 13 Invoices as ZIP
    </button>
    <div class="dl-list">
      ${invoices.map(inv=>`
        <div class="dl-row">
          <div class="info">
            <div class="name">${ICONS[inv.type]||'📄'} ${inv.name}</div>
            <div class="type">${inv.type}</div>
          </div>
          <button class="dl-btn" id="b_${inv.id}" onclick="dlOne('${token}','${inv.id}',this)">⬇ Download</button>
        </div>`).join('')}
    </div>
    <p style="text-align:center;font-size:.76rem;color:#94a3b8;margin-top:20px">Link expires in 24 hours. Contact <a href="mailto:info@amgassociate.net" style="color:#1e3a5f">info@amgassociate.net</a> for support.</p>`;
}

async function dlAll(token){
  const btn=document.getElementById('dlAllBtn');
  btn.disabled=true; btn.innerHTML='⏳ Preparing ZIP...';
  document.getElementById('overlay').classList.add('show');
  try{
    const resp=await fetch('/api/download/'+token);
    if(resp.status===401){showExpired('Download link expired.');return;}
    if(!resp.ok){toast('Download failed.');return;}
    const blob=await resp.blob();
    const cd=resp.headers.get('content-disposition')||'';
    trigger(blob, cd.match(/filename="?([^"]+)"?/)?.[1]||'GST_Invoices.zip');
    btn.innerHTML='✅ All Downloaded!';
    toast('✅ All 13 invoices downloaded!');
  }catch(e){toast('Error: '+e.message);btn.disabled=false;btn.innerHTML='⬇ Download All 13 as ZIP';}
  finally{document.getElementById('overlay').classList.remove('show');}
}

async function dlOne(token,id,btn){
  btn.disabled=true; btn.textContent='⏳';
  try{
    const resp=await fetch('/api/download-single/'+token+'/'+id);
    if(!resp.ok){btn.disabled=false;btn.textContent='⬇ Download';toast('Failed.');return;}
    const blob=await resp.blob();
    const cd=resp.headers.get('content-disposition')||'';
    trigger(blob, cd.match(/filename="?([^"]+)"?/)?.[1]||id+'.xlsx');
    btn.textContent='✅ Done'; btn.classList.add('done');
  }catch(e){btn.disabled=false;btn.textContent='⬇ Download';toast('Error: '+e.message);}
}

function trigger(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}

function showExpired(msg){
  document.getElementById('mainContent').innerHTML=`
    <div class="expired">
      <div class="icon">⏰</div>
      <h2>Link Expired or Invalid</h2>
      <p>${msg}</p>
      <a href="/">Place a New Order</a>
    </div>`;}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
init();
</script>
</body>
</html>
